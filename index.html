<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple weather dashboard with current weather and a 5-day forecast.">
        <title>Weather Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <main class="container">

            <header class="header">
                <h1>Weather Dashboard</h1>
                <p>Check the weather anywhere in the world</p>
            </header>

            <section class="search-section">
                <input type="text" id="city-input" placeholder="Enter city name..." aria-label="City name">
                <button id="search-button">Search</button>
            </section>

            <p id="message" class="message" role="status"></p>

            <section class="weather-card">

                <div class="location">
                    <h2 id="city-name">--</h2>
                    <p id="weather-description">--</p>
                </div>

                <div id="weather-icon" class="weather-icon">🌤️</div>

                <div class="temperature">
                    <span id="temperature">--</span>
                    <span id="temperature-unit">°C</span>
                </div>

                <button id="unit-toggle" class="unit-button">
                    Switch to °F
                </button>

                <div class="weather-details">
                    <div class="detail">
                        <span>Humidity</span>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="detail">
                        <span>Wind Speed</span>
                        <strong id="wind-speed">-- km/h</strong>
                    </div>
                </div>

            </section>

            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div id="forecast-container" class="forecast-container"></div>
            </section>

            <footer>
                <p>Weather data provided by Open-Meteo</p>
            </footer>

        </main>

        <script src="script.js"></script>
    </body>

</html>
